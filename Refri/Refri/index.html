<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Mateus Refri</title>
</head>
<body>
    <main>
        <div class="item active" style="--background: #EA3D41">
            <div class="title">Morango</div>
            <img src="img\fruit-morango.png" class="fruit">
            <img src="img\refri-morango.png" class="refri">
        </div>
        <div class="item" style="--background: #2D5643">
            <div class="title">Abacate</div>
            <img src="img\fruit-aba.png" class="fruit">
            <img src="img\refri-aba.png" class="refri">
        </div>
        <div class="item" style="--background: #E7A043">
            <div class="title">Laranja</div>
            <img src="img\fruit-laranja.png" class="fruit">
            <img src="img\refri-laranja.png" class="refri">
        </div>

        <div class="arrow">
            <button id="prev"> < </button>
            <button id="next"> > </button>
        </div>
    </main>
</body>
<script src="script.js"></script>
</html>
