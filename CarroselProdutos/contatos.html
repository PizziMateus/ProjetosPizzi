<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Orbitron:wght@400..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

    <title>Contatos</title>
</head>

<body>

    <header>

        <div class="logo">Tech Store</div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="contatos.html">Contatos</a></li>
            </ul>
        </nav>

    </header>

    <main class="container">

        <div class="tech-circle">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
        </div>

        <div
            style="height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:2;position:relative;">

            <h1 style="font-family:Orbitron;font-size:4rem;margin-bottom:40px;">
                Entre em Contato
            </h1>

            <form style="display:flex;flex-direction:column;gap:20px;width:400px;">
                <input type="text" placeholder="Seu nome" required>
                <input type="email" placeholder="Seu email" required>
                <textarea rows="5" placeholder="Sua mensagem"></textarea>
                <button class="btn-home">Enviar mensagem</button>
            </form>

        </div>

    </main>

</body>
<script src="page-transition.js"></script>

</html>
