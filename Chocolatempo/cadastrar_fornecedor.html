<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CHOCOLATEMPO — Cadastrar Fornecedor</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg" />
</head>
<body>
  <div class="container">
    <header class="header"><div class="brand"><div class="logo">C</div><div><h1>CHOCOLATEMPO</h1><div class="small">Painel Admin</div></div></div>
    <nav class="nav"><a href="index.html">Home</a><a href="cadastrar_fornecedor.html">Cadastrar Fornecedor</a><a href="relatorio_compras.html">Relatórios</a></nav>
    <div class="menu-right"><button class="btn">Salvar</button></div></header>

    <section style="margin-top:18px">
      <div class="form-panel">
        <h2>Novo Fornecedor</h2>
        <form class="form-grid">
          <div>
            <label>Razão social</label>
            <input class="input" />
          </div>
          <div>
            <label>CNPJ</label>
            <input class="input" />
          </div>
          <div>
            <label>Nome do contato</label>
            <input class="input" />
          </div>
          <div>
            <label>Telefone</label>
            <input class="input" />
          </div>
          <div>
            <label>E-mail</label>
            <input class="input" />
          </div>
          <div>
            <label>Site</label>
            <input class="input" />
          </div>
          <div>
            <label>CEP</label>
            <input class="input" />
          </div>
          <div>
            <label>Endereço (Rua, Nº, Cidade/UF)</label>
            <input class="input" />
          </div>
          <div>
            <label>Condição de pagamento (dias)</label>
            <input class="input" />
          </div>
          <div class="full">
            <label>Observações</label>
            <textarea class="input" rows="3"></textarea>
          </div>

          <div class="full" style="display:flex;justify-content:flex-end;gap:10px;margin-top:8px">
            <button type="reset" class="btn ghost">Limpar</button>
            <button class="btn">Salvar Fornecedor</button>
          </div>
        </form>
      </div>
    </section>

    <footer class="footer"><div class="small">CHOCOLATEMPO</div><div class="small">© 2025</div></footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
