<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CHOCOLATEMPO — Cadastro de Produtos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand"><div class="logo">C</div><div><h1>CHOCOLATEMPO</h1><div class="small">Painel Admin</div></div></div>
      <nav class="nav"><a href="index.html">Home</a><a href="cadastro_produtos.html">Cadastro de Produtos</a><a href="relatorio_vendas.html">Relatórios</a></nav>
      <div class="menu-right"><button class="btn">Salvar</button></div>
    </header>

    <section style="margin-top:18px">
      <div class="form-panel">
        <h2>Novo Produto</h2>
        <form class="form-grid">
          <div>
            <label>Nome</label>
            <input class="input" placeholder="Ex: Trufa Clássica" />
          </div>
          <div>
            <label>SKU</label>
            <input class="input" placeholder="EX: TRF-001" />
          </div>
          <div>
            <label>Categoria</label>
            <select><option>Trufas</option><option>Tabletes</option><option>Bombons</option><option>Box</option></select>
          </div>
          <div>
            <label>Fornecedor</label>
            <select><option>Fornecedor A</option><option>Fornecedor B</option></select>
          </div>
          <div>
            <label>Preço de venda (R$)</label>
            <input class="input" placeholder="0,00" />
          </div>
          <div>
            <label>Custo (R$)</label>
            <input class="input" placeholder="0,00" />
          </div>
          <div>
            <label>Desconto (%)</label>
            <input class="input" placeholder="0" />
          </div>
          <div>
            <label>Estoque inicial</label>
            <input class="input" placeholder="0" />
          </div>

          <div class="full">
            <label>Descrição</label>
            <textarea rows="4" class="input"></textarea>
          </div>

          <div>
            <label>Unidade</label>
            <select><option>un</option><option>g</option><option>kg</option></select>
          </div>
          <div>
            <label>Peso (g)</label>
            <input class="input" />
          </div>

          <div>
            <label>Dimensões (C x L x A)</label>
            <input class="input" placeholder="cm" />
          </div>
          <div>
            <label>Imagem (URL)</label>
            <input class="input" placeholder="https://..." />
          </div>

          <div class="full" style="display:flex;justify-content:flex-end;gap:10px;margin-top:8px">
            <button type="reset" class="btn btn-ghost ghost">Limpar</button>
            <button class="btn">Salvar Produto</button>
          </div>
        </form>
      </div>
    </section>

    <footer class="footer"><div class="small">CHOCOLATEMPO</div><div class="small">© 2025</div></footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
